<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analoq skaneri — TerraTwin</title>
<meta name="description" content="Click anywhere on Earth: a live NASA POWER request shows how similar the place is to the Moon and Mars.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='26' cy='34' r='18' fill='%235B9BE6'/%3E%3Ccircle cx='50' cy='14' r='8' fill='%23D97A48'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/scanner.css">
<script src="data/power.js"></script>
</head>
<body class="scan">

<header class="bar">
  <a class="brand" href="skaner.html">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="16" cy="22" r="11" fill="#5B9BE6"/><circle cx="16" cy="22" r="11" fill="url(#sh)"/><circle cx="33" cy="10" r="4.2" fill="#D97A48"/><circle cx="31" cy="30" r="2.6" fill="#C9CCD3"/><defs><radialGradient id="sh" cx=".7" cy=".3" r=".9"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs></svg>
    <span>TerraTwin</span>
  </a>
  <nav class="links"><a href="terraanalog.html">TerraAnalog</a><a href="oyun.html" id="lnkGame"></a><a href="presentation.html" id="lnkDeck"></a></nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="az">AZ</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main class="scanner">
  <section class="mapcol">
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="map" id="map" tabindex="0">
      <div class="world" id="world">
        <img src="assets/tex/earth_day_8k.jpg" alt="" draggable="false">
        <div id="dots"></div>
        <div class="pin" id="pin" hidden><i></i></div>
      </div>
      <div class="zoom"><button type="button" id="zin" aria-label="+">+</button><button type="button" id="zout" aria-label="−">−</button></div>
    </div>
    <form class="goto" id="goto">
      <div class="presets" id="presets"></div>
      <label><span id="latL"></span><input id="lat" inputmode="decimal" autocomplete="off"></label>
      <label><span id="lonL"></span><input id="lon" inputmode="decimal" autocomplete="off"></label>
      <button class="btn" type="submit" id="go"></button>
    </form>
  </section>
  <aside class="result" id="result" aria-live="polite"></aside>
</main>

<script type="module" src="js/scanner.js"></script>
</body>
</html>
